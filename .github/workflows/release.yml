name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-apple-silicon
            os: macos-14
            target: aarch64-apple-darwin
            asset: r-shell-macos-apple-silicon.dmg
          - name: macos-intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            asset: r-shell-macos-intel.dmg
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: r-shell-windows-x64-installer.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './cli -> target'
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --manifest-path cli/Cargo.toml --target ${{ matrix.target }}

      - name: Package macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x packaging/macos/create_dmg.sh
          packaging/macos/create_dmg.sh "${{ matrix.target }}" "dist/${{ matrix.asset }}"

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Derive a clean version from the tag (fallback to 0.0.0).
          $version = "${{ github.ref_name }}"
          if ($version.StartsWith("v")) { $version = $version.Substring(1) }
          if ($version -eq "main" -or [string]::IsNullOrWhiteSpace($version)) { $version = "0.0.0" }
          $parts = @()
          foreach ($part in ($version -split '\.')) {
            if ($part -match '^\d+$') { $parts += $part } else { $parts += "0" }
          }
          while ($parts.Count -lt 4) { $parts += "0" }
          $versionQuad = ($parts[0..3] -join ".")

          $root = (Resolve-Path ".").Path
          $stage = "$root\dist\stage"
          New-Item -ItemType Directory -Force "$root\dist", $stage | Out-Null
          Copy-Item "cli/target/${{ matrix.target }}/release/r-shell.exe" "$stage\"
          Copy-Item "README.md" "$stage\" -ErrorAction SilentlyContinue
          Copy-Item "LICENSE" "$stage\" -ErrorAction SilentlyContinue

          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (!(Test-Path $makensis)) { $makensis = "makensis" }
          & $makensis `
            "/DAPP_VERSION=$version" `
            "/DAPP_VERSION_QUAD=$versionQuad" `
            "/DSTAGE_DIR=$stage" `
            "/DOUTPUT_EXE=$root\dist\${{ matrix.asset }}" `
            "packaging\windows\r-shell.nsi"

      - name: Verify packaged asset
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem -Path "dist" -Recurse | Format-Table FullName, Length
          if (!(Test-Path "dist/${{ matrix.asset }}")) {
            throw "Missing packaged asset: dist/${{ matrix.asset }}"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "R-Shell $TAG_NAME" \
            --notes "Automated R-Shell release. Downloads: macOS Apple Silicon (.dmg), macOS Intel (.dmg), and a Windows x64 installer (.exe)."
