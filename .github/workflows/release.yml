name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './cli -> target'

      - name: Install build dependencies (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev

      - name: Build release binary
        working-directory: cli
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary (Unix)
        if: matrix.platform != 'windows-latest'
        run: |
          BIN_DIR="cli/target/${{ matrix.target }}/release"
          ARCHIVE="r-shell-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          tar -czvf "$ARCHIVE" -C "$BIN_DIR" r-shell
          echo "ASSET=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Package binary (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $BinDir = "cli/target/${{ matrix.target }}/release"
          $Archive = "r-shell-${{ github.ref_name }}-${{ matrix.target }}.zip"
          Compress-Archive -Path "$BinDir/r-shell.exe" -DestinationPath $Archive
          "ASSET=$Archive" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'r-shell ${{ github.ref_name }}'
          body: 'See the assets to download this version.'
          draft: false
          prerelease: false
          files: ${{ env.ASSET }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Generate SHA256 checksums for Homebrew
  generate-checksums:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Wait for release assets
        run: sleep 30

      - name: Download release assets
        uses: robinraju/release-downloader@v1.11
        with:
          tag: ${{ github.ref_name }}
          fileName: '*.tar.gz'
          out-file-path: assets

      - name: Generate SHA256 checksums
        run: |
          cd assets
          echo "# SHA256 Checksums for r-shell ${{ github.ref_name }}" > checksums.txt
          echo "" >> checksums.txt
          for f in *.tar.gz; do
            if [ -f "$f" ]; then
              sha256sum "$f" | tee -a checksums.txt
            fi
          done

      - name: Upload checksums to release
        uses: softprops/action-gh-release@v2
        with:
          files: assets/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Update Homebrew tap (requires HOMEBREW_TAP_TOKEN secret)
  update-homebrew:
    needs: generate-checksums
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, 'alpha') && !contains(github.ref_name, 'beta')
    steps:
      - name: Update Homebrew Cask
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: GOODBOY008/homebrew-tap
          event-type: update-cask
          client-payload: '{"version": "${{ github.ref_name }}", "repository": "${{ github.repository }}"}'
