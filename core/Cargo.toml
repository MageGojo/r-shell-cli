[package]
name = "r-shell-core"
version = "2.1.0"
edition = "2024"
description = "Core SSH / SFTP / monitor / MCP logic shared by the R-Shell CLI and desktop GUI."
license = "MIT"

[lib]
name = "r_shell_core"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
dirs = { workspace = true }
rmcp = { workspace = true }
russh = { workspace = true }
russh-keys = { workspace = true }
russh-sftp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sysinfo = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
